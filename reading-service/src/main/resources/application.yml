server:
  port: 8088
  tomcat:
    max-http-form-post-size: 8MB
    max-swallow-size: 8MB

reading:
  upload-dir: uploads

spring:
  application:
    name: reading-service
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 4MB
  datasource:
    url: jdbc:mysql://localhost:3306/reading_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
